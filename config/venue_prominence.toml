version = 1

# Display order for museum lists (the web explorer, the app, and the SEO state /
# city pages all render the API's venue order).
#
# Museums used to sort by upcoming program count alone, which buried the names
# people actually search for: the Whitney with one program sat 200 rows below a
# regional gallery running 194. Every museum named here gets that tier's rank;
# anything not listed falls to the default rank and keeps the old
# "most programs first" ordering inside its own band.
#
# Editing:
# - Names are matched case-insensitively against the venue name stored in MySQL,
#   ignoring a leading "The", so list the museum the way the DB spells it.
# - A museum that appears under more than one spelling (e.g. "MoMA" and
#   "Museum of Modern Art") just gets one entry per spelling.
# - Listing a museum that has no rows yet is harmless; it takes effect when the
#   crawler first stores it.
# - Keep ranks sparse (10/20/30) so a band can be inserted without renumbering.

[[tiers]]
rank = 10
label = "national"
description = "National institutions and the encyclopedic/modern flagships known nationwide."
venues = [
  # Washington, DC — national collections
  "National Gallery of Art",
  "Smithsonian American Art Museum",
  "National Portrait Gallery",
  "Hirshhorn Museum and Sculpture Garden",
  "National Museum of Asian Art",
  "Renwick Gallery",
  # New York
  "The Metropolitan Museum of Art",
  "MoMA",
  "Museum of Modern Art",
  "Whitney Museum of American Art",
  "Solomon R. Guggenheim Museum",
  "Guggenheim Museum",
  "Brooklyn Museum",
  # Other flagships
  "Art Institute of Chicago",
  "Museum of Fine Arts, Boston",
  "Philadelphia Museum of Art",
  "Los Angeles County Museum of Art",
  "J. Paul Getty Museum",
  "Getty Center",
